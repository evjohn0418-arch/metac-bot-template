name: Test Bot

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["config/run_test.txt"] # a commit that changes this file starts a test run

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write # the run appends its record to records/runs.jsonl

# Forecasts on a handful of questions in Metaculus's bot-testing-area. Nothing here counts
# toward a prize. Use it to prove the tokens, the models and the spend plan before going live.
jobs:
  forecast_job:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
      - name: Install dependencies
        id: install
        run: |
          set -o pipefail
          uv sync --locked 2>&1 | tee run.log
      - name: Run bot on test questions
        id: run
        run: |
          set -o pipefail
          uv run python agent_bot.py --mode test_questions 2>&1 | tee -a run.log
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
          ASKNEWS_SECRET: ${{ secrets.ASKNEWS_SECRET }}
      # The tail of the output, with secret values removed, is kept with the records.
      - name: Save a short log
        if: always()
        run: python3 .github/save_log.py test "install=${{ steps.install.outcome }} run=${{ steps.run.outcome }}"
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
          ASKNEWS_SECRET: ${{ secrets.ASKNEWS_SECRET }}
      - name: Save the run record
        if: always()
        run: bash .github/save_records.sh "Test run record"
