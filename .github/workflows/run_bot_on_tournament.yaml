name: Forecast on new AI tournament questions

on:
  workflow_dispatch:
  schedule:
    - cron: "2,12,22,32,42,52 * * * *" # every 10 minutes; GitHub often starts scheduled runs late or skips them

# One run at a time; a run that is still going makes the next one wait.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write # the run appends its record to records/runs.jsonl

jobs:
  forecast_job:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      # The live switch is config/bot_config.json "live". Until it is true this job does nothing
      # and costs nothing, whatever secrets are set.
      - name: Check the live switch
        id: live
        run: |
          if python3 -c "import json,sys; sys.exit(0 if json.load(open('config/bot_config.json')).get('live') is True else 1)"; then
            echo "live=true" >> "$GITHUB_OUTPUT"
          else
            echo "live=false" >> "$GITHUB_OUTPUT"
            echo "Bot is not live (config/bot_config.json has live=false). Nothing to do."
          fi
      - uses: actions/setup-python@v5
        if: steps.live.outputs.live == 'true'
        with:
          python-version: "3.11"
      - name: Install uv
        if: steps.live.outputs.live == 'true'
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
      - name: Install dependencies
        id: install
        if: steps.live.outputs.live == 'true'
        run: |
          set -o pipefail
          uv sync --locked 2>&1 | tee run.log
      - name: Run bot
        id: run
        if: steps.live.outputs.live == 'true'
        run: |
          set -o pipefail
          uv run python agent_bot.py --mode tournament 2>&1 | tee -a run.log
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
          ASKNEWS_SECRET: ${{ secrets.ASKNEWS_SECRET }}
      # Only when the job fails: the tail of the output, with secret values removed.
      - name: Save a short log
        if: failure() && steps.live.outputs.live == 'true'
        run: python3 .github/save_log.py tournament "install=${{ steps.install.outcome }} run=${{ steps.run.outcome }}"
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
          ASKNEWS_SECRET: ${{ secrets.ASKNEWS_SECRET }}
      - name: Save the run record
        if: always() && steps.live.outputs.live == 'true'
        run: bash .github/save_records.sh "Run record"
